[project]
name = "tt-engine"
version = "2.0.0"
description = "TT <-> TERMINAL card ingest, validation, and ranking engine (spec v2.0)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
